[workspace]
members = [
  "crates/product-gameplay",
  "crates/product-runtime",
  "crates/product-export",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rusty-engine = { path = "../rusty-engine/rust/crates/rusty-engine" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

