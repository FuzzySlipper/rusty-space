name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coreclr:
    name: CoreCLR verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read Engine pin
        id: engine
        shell: bash
        run: |
          version=$(sed -n 's|.*<RustyEnginePackageVersion>\([^<]*\)</RustyEnginePackageVersion>.*|\1|p' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rusty-engine/pairs/${{ steps.engine.outputs.version }}
          key: rusty-engine-linux-x64-${{ steps.engine.outputs.version }}
      - name: Install rusty CLI
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/FuzzySlipper/rusty-engine/main/scripts/install-rusty.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify product
        run: ./scripts/verify.sh
